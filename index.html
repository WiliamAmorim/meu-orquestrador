<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Orquestrador</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            margin: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .bot {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        .status {
            font-weight: bold;
        }

        .running {
            color: green;
        }

        .stopped {
            color: red;
        }

        button {
            margin-right: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .logs {
            background: black;
            color: #00ff00;
            padding: 10px;
            height: 150px;
            overflow-y: scroll;
            font-family: monospace;
        }
    </style>
</head>

<body>

<header>
    <h1>🚀 Meu Orquestrador</h1>
    <p>Status geral: Online</p>
</header>

<div class="container">

    <h2>Bots</h2>

    <div class="bot">
        <p><strong>Bot Financeiro</strong></p>
        <p>Status: <span class="status running" id="status1">Rodando</span></p>

        <button onclick="startBot('status1')">▶️ Executar</button>
        <button onclick="stopBot('status1')">⛔ Parar</button>
    </div>

    <div class="bot">
        <p><strong>Bot Notas</strong></p>
        <p>Status: <span class="status stopped" id="status2">Parado</span></p>

        <button onclick="startBot('status2')">▶️ Executar</button>
        <button onclick="stopBot('status2')">⛔ Parar</button>
    </div>

    <h2>Logs</h2>
    <div class="logs" id="logs">
        Sistema iniciado...
    </div>

</div>

<script>
    function addLog(message) {
        const logs = document.getElementById("logs");
        const time = new Date().toLocaleTimeString();
        logs.innerHTML += `<br>[${time}] ${message}`;
        logs.scrollTop = logs.scrollHeight;
    }

    function startBot(id) {
        const el = document.getElementById(id);
        el.innerText = "Rodando";
        el.className = "status running";
        addLog("Bot iniciado");
    }

    function stopBot(id) {
        const el = document.getElementById(id);
        el.innerText = "Parado";
        el.className = "status stopped";
        addLog("Bot parado");
    }
</script>

</body>
</html>
